<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head><body><title>Catering Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed kitchen-pass sidebar (deep teal) + working canvas of panels; tickets for events, pills for state. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --line:#D3DCD9; --fg:#13211E; --muted:#5A6B66;
  --accent:#B5620E; --accent-soft:#F6E6D3; --accent-ink:#FFFFFF;
  --ink:#0E3A35; --ink-2:#14504A; --ink-fg:#E4F0ED; --ink-muted:#9DBFB8;
  --good:#1D7A4C; --good-soft:#DCF1E5; --warn:#A86A12; --warn-soft:#FBEFD6; --bad:#B42318; --bad-soft:#FBE3E0;
  --c1:#0F6B5F; --c2:#D08A2E; --c3:#7A5BA6; --c4:#C2543A; --c5:#4F7FA8; --c6:#8A9A3B;
  --shadow:0 1px 2px rgba(14,58,53,.06),0 4px 14px rgba(14,58,53,.05);
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#141E1B; --surface-2:#1B2825; --line:#283834; --fg:#E5EEEB; --muted:#93A6A0;
  --accent:#E59B47; --accent-soft:#3A2A17; --accent-ink:#1A1206;
  --ink:#09110F; --ink-2:#13221F; --ink-fg:#DCEAE6; --ink-muted:#7FA39B;
  --good:#4CC38A; --good-soft:#163527; --warn:#E3B152; --warn-soft:#3A2E14; --bad:#F27466; --bad-soft:#3D1A17;
  --c1:#3DB5A2; --c2:#E5A04F; --c3:#A98AD6; --c4:#E57D62; --c5:#76A9D6; --c6:#B5C45E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141E1B; --surface-2:#1B2825; --line:#283834; --fg:#E5EEEB; --muted:#93A6A0;
  --accent:#E59B47; --accent-soft:#3A2A17; --accent-ink:#1A1206;
  --ink:#09110F; --ink-2:#13221F; --ink-fg:#DCEAE6; --ink-muted:#7FA39B;
  --good:#4CC38A; --good-soft:#163527; --warn:#E3B152; --warn-soft:#3A2E14; --bad:#F27466; --bad-soft:#3D1A17;
  --c1:#3DB5A2; --c2:#E5A04F; --c3:#A98AD6; --c4:#E57D62; --c5:#76A9D6; --c6:#B5C45E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.08rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%;background:linear-gradient(to right,var(--ink) 236px,var(--bg) 236px)}
.side{background:var(--ink);color:var(--ink-fg);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.15}
.brand-sub{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--ink-2)}
.nav a.on{background:var(--ink-2);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:.75rem;color:var(--ink-muted);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-muted);margin-right:6px;vertical-align:middle}
.dot.on{background:#4CC38A}
.topbar{display:none}
.main{padding-block:22px 48px;padding-inline:28px;min-width:0;max-width:1440px;width:100%}
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;font-weight:600}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:.78rem}
.btn svg{width:15px;height:15px}
.icon-btn{border:0;background:transparent;padding:5px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:16px;height:16px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=email],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:260px}
.toolbar select{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.84rem;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--ink-fg)}

/* panels */
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h .sub{color:var(--muted);font-size:.8rem}
.stack{display:flex;flex-direction:column;gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.kpi-l{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi-v{font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.kpi-s{font-size:.78rem;color:var(--muted)}
.delta{font-weight:700;font-size:.78rem}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}
.chart-box.lg{height:320px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
th.n,td.n{text-align:right}
tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
td .strong{font-weight:600}
td.act{white-space:nowrap;text-align:right;width:1%}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.ink{background:var(--ink);color:var(--ink-fg)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--c1);border-radius:99px}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.qty-cell{display:flex;flex-direction:column;gap:4px;min-width:110px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.sev{width:4px;align-self:stretch;border-radius:4px;background:var(--muted);flex:none}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.good{background:var(--good)} .sev.acc{background:var(--accent)}

/* tickets (upcoming events) */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;position:relative;font-family:var(--f-mono);font-size:.78rem;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.ticket:hover{border-color:var(--accent)}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-1px;height:6px;background:radial-gradient(circle at 6px 0,var(--bg) 4px,transparent 4.5px) repeat-x;background-size:12px 6px}
.ticket .t-date{display:flex;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.ticket .t-client{font-family:var(--f-display);font-size:1rem;font-weight:600;color:var(--fg)}
.ticket .t-row{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:6px}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.76rem;color:var(--muted)}
.card .c-act{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}

/* roster */
.roster td,.roster th{padding:6px 8px}
.roster td.cell{min-width:96px;cursor:pointer;vertical-align:top}
.roster td.cell:hover{background:var(--surface-2)}
.shift{display:block;background:var(--accent-soft);color:var(--fg);border-radius:6px;padding:3px 6px;font-size:.74rem;margin-bottom:3px;font-variant-numeric:tabular-nums;border:0;width:100%;text-align:left;cursor:pointer}
.shift.leave{background:var(--bad-soft);color:var(--bad)}
.roster th.today{color:var(--accent)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,18,16,.5);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{max-width:820px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.field .help{font-size:.74rem;color:var(--muted)}
.lines{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 90px 100px 30px;gap:6px;align-items:center}
.line.ing{grid-template-columns:minmax(0,1fr) 100px 90px 30px}
.line-total{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.84rem}
.line-total b{font-variant-numeric:tabular-nums}

/* misc */
.toast-wrap{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--ink-fg);padding:10px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:500;max-width:340px}
.toast.bad{background:var(--bad);color:#fff}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:.86rem}
.insight{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight .tag{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase}
.insight p{margin:3px 0 0;color:var(--muted)}
.ai-out{white-space:pre-wrap;line-height:1.6;max-width:75ch}
.ai-out h4{font-family:var(--f-display);margin:12px 0 4px;font-size:.98rem}
.loader{display:grid;place-items:center;min-height:60vh;color:var(--muted);gap:10px;text-align:center}
.matrix-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;font-size:.78rem}
.matrix-legend div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:.88rem}
.kv .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.kv .total{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.hide-sm{}
@media (max-width:1100px){.g-2,.g-3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--bg)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s ease;height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--ink-fg);padding:10px 16px;position:sticky;top:0;z-index:30}
  .topbar .icon-btn{color:var(--ink-fg)}
  .main{padding-inline:16px;padding-block:16px 40px}
  .g-2e,.board{grid-template-columns:minmax(0,1fr)}
  .modal-b{grid-template-columns:minmax(0,1fr)}
  .line,.line.ing{grid-template-columns:minmax(0,1fr) 70px 80px 30px}
  .hide-sm{display:none}
  h1{font-size:1.35rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <button class="icon-btn" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <strong class="brand-name" id="topName">Catering Control Room</strong>
</div>
<div class="app">

      <div class="brand-mark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18h18M5 18a7 7 0 0 1 14 0M12 8V6M10 6h4"/></svg></div>
      <div><div class="brand-name" id="sideName">Catering Control Room</div><div class="brand-sub">Operations</div></div>

async function saveUser(v,old){const e=String(v.email||'').trim().toLowerCase();

  if(!old&&fbAccess.some(u=>u.id===e))return 'This email is already on the list.';
  try{if(old&&old.id!==e)await db.collection('access').doc(old.id).delete();
    await db.collection('access').doc(e).set({name:v.name,role:v.role||'Staff',note:v.note||'',addedBy:old?old.addedBy||'':fbUser.email,addedAt:old?old.addedAt||today():today()});
    fbOwner=true;toast(old?'User updated':'User added. They can sign in now.')}
  catch(err){if(err&&err.code==='permission-denied'){fbOwner=false;render();return 'Only the owner can change the sign-in list.'}return 'Could not save: '+(err.message||err.code)}}
function editUser(id){const u=id?fbAccess.find(x=>x.id===id):null;
  openForm({title:u?'Edit app user':'Add app user',fields:[{k:'name',label:'Name',req:1},{k:'email',label:'Google (Gmail) address',type:'email',req:1,help:'They sign in with this account'},{k:'role',label:'Role',type:'select',options:USER_ROLES},{k:'note',label:'Note',full:1}],
    values:u?{...u,email:u.id}:{role:'Staff'},onSave:v=>saveUser(v,u)})}
function removeUser(id){const u=fbAccess.find(x=>x.id===id);if(!u)return;
  confirmBox(`Remove <b>${esc(u.name||id)}</b> (${esc(id)}) from the sign-in list? They will lose access straight away.`,async()=>{
    try{await db.collection('access').doc(id).delete();fbOwner=true;toast('User removed')}catch(err){if(err&&err.code==='permission-denied'){fbOwner=false;render();toast('Only the owner can change the sign-in list.','bad')}else toast('Could not remove: '+(err.message||err.code),'bad')}},'Remove')}
function fbScreen(title,body,action){fbHold=true;$('#main').innerHTML=`<div class="loader"><div class="panel" style="max-width:440px;text-align:left"><div class="eyebrow">${esc(S.settings.business||'Catering Control Room')}</div><h1 style="margin-bottom:8px">${title}</h1><p class="muted" style="margin:0 0 16px">${body}</p>${action||''}</div></div>`}
function initFirebase(){
  const cfg=window.FIREBASE_CONFIG;if(!cfg.apiKey||/PASTE/.test(cfg.apiKey)){fbScreen('Finish setup','This copy of the app is not connected to a Firebase project yet. Open firebase-config.js in your GitHub repository and paste the settings from your Firebase project, as described in the setup guide.');return}
  try{if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG)}catch(e){fbScreen('Setup needed','The Firebase settings in firebase-config.js could not be read. Paste the config from your Firebase project and upload the file again.');return}
  const auth=firebase.auth();
  auth.onAuthStateChanged(user=>{
    fbSubs.forEach(u=>{try{u()}catch(e){}});fbSubs=[];loaded.clear();fbUser=user;fbAccess=[];fbOwner=null;
    if(!user){mode='loading';fbScreen('Sign in','Sign in with the Google account the owner added to the app users list.',`<button class="btn primary" id="fbSignIn">Sign in with Google</button>`);
      $('#fbSignIn').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{if(e&&e.code==='auth/popup-blocked'||e&&e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());else if(e&&e.code!=='auth/popup-closed-by-user')toast('Sign-in failed: '+(e.message||e.code),'bad')});return}
    fbHold=false;db=firebase.firestore();mode='cloud';render();
    let denied=false;
    const fail=e=>{console.warn(e);if(e&&e.code==='permission-denied'&&!denied){denied=true;fbSubs.forEach(u=>{try{u()}catch(x){}});fbSubs=[];mode='loading';
      fbScreen('You need access',`You are signed in as <b>${esc(user.email)}</b>, but this account is not on the app users list. Ask the owner to add this email under App users, then reload this page.`,`<button class="btn" id="fbOut">Sign in with a different account</button>`);$('#fbOut').onclick=()=>auth.signOut()}};
    const done=k=>{if(denied)return;loaded.add(k);scheduleRender()};
    COLS.forEach(c=>fbSubs.push(db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(x=>({...x.data(),id:x.id}));done(c)},fail)));
    // Owner check: deleting a doc that never exists is allowed only for owners and changes nothing.
    db.collection('access').doc('_owner-check').delete().then(()=>{fbOwner=true;scheduleRender()},()=>{fbOwner=false;scheduleRender()});
    fbSubs.push(db.collection('access').onSnapshot(snap=>{fbAccess=snap.docs.map(x=>({...x.data(),id:x.id}));scheduleRender()},e=>console.warn(e)));
    fbSubs.push(db.doc('settings/main').onSnapshot(s=>{S.settings={...DEFAULT_SETTINGS,...(s.exists?s.data():{})};done('settings')},fail));
  });
}

let pending=0,me=null;
async function api(method,path,body){
  pending++;
  try{const r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store'});
    if(r.status===401||r.status===403){toast('Your sign-in has expired. Reloading…','bad');setTimeout(()=>location.reload(),1800);throw {code:'auth'}}
    if(!r.ok){let m='';try{m=(await r.json()).error}catch(e){}throw {code:'http',message:m||('Server error '+r.status)}}
    return r.status===204?null:await r.json()}
  finally{pending--}
}
async function initServer(){
  if(!/^https?:$/.test(location.protocol))return false;
  try{const r=await fetch('api/data',{credentials:'same-origin',cache:'no-store'});if(!r.ok||!(r.headers.get('content-type')||'').includes('json'))return false;
    const d=await r.json();if(!d||d.app!=='catering-control-room')return false;mode='server';applyData(d)}catch(e){return false}
  try{const m=await (await fetch('/.auth/me',{credentials:'same-origin'})).json();me=m&&m.clientPrincipal}catch(e){}
  render();
  setInterval(()=>{if(document.visibilityState==='visible')refreshServer()},30000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshServer()});
  return true;
}

let C={};
function derive(){
  C.inv={};S.inventory.forEach(i=>C.inv[i.id]=i);
  C.staff={};S.staff.forEach(s=>C.staff[s.id]=s);
  C.menu={};C.cost={};S.menu.forEach(m=>{C.menu[m.id]=m;C.cost[m.id]=sum(m.ingredients||[],g=>{const it=C.inv[g.itemId];return it?num(g.qty)*num(it.cost):0})});
  C.ev={};S.events.forEach(e=>C.ev[e.id]=e);
  C.shiftsByEvent={};S.shifts.forEach(s=>{if(s.eventId)(C.shiftsByEvent[s.eventId]=C.shiftsByEvent[s.eventId]||[]).push(s)});
}
const stdH=()=>num(S.settings.stdHours)||208;
const hourlyRate=st=>!st?0:st.payType==='monthly'?num(st.rate)/stdH():num(st.rate);
const shiftHours=s=>num(s.hours)||hoursOf(s.start,s.end);
const shiftCost=s=>shiftHours(s)*hourlyRate(C.staff[s.staffId]);
const evRevenue=e=>sum(e.lines||[],l=>num(l.qty)*num(l.price))+num(e.extra)-num(e.discount);
const evCogs=e=>sum(e.lines||[],l=>num(l.qty)*(C.cost[l.menuId]||0));
const evLabour=e=>sum(C.shiftsByEvent[e.id]||[],shiftCost);
const evProfit=e=>evRevenue(e)-evCogs(e)-evLabour(e);
const evBalance=e=>Math.max(0,evRevenue(e)-num(e.paid));
const itemValue=i=>num(i.qty)*num(i.cost);
const stockState=i=>{if(num(i.qty)<=0)return 'out';if(num(i.qty)<=num(i.reorder))return 'low';return 'ok'};
const expiryState=i=>{if(!i.expiry)return null;const d=daysBetween(today(),i.expiry);if(d<0)return 'expired';if(d<=7)return 'soon';return null};
function staffActiveIn(st,mk){if(st.status==='inactive'&&st.endDate&&st.endDate<mk+'-01')return false;if(st.start&&st.start>monthEnd(mk))return false;if(st.endDate&&st.endDate<mk+'-01')return false;return true}
function pl(mk){
  const evs=S.events.filter(e=>e.status==='completed'&&monthKey(e.date)===mk);
  const revenue=sum(evs,evRevenue),cogs=sum(evs,evCogs);
  const waste=sum(S.movements.filter(m=>m.type==='waste'&&monthKey(m.date)===mk),m=>num(m.qty)*num(m.cost));
  const casual=sum(S.shifts.filter(s=>monthKey(s.date)===mk&&C.staff[s.staffId]&&C.staff[s.staffId].payType!=='monthly'),shiftCost);
  const mtd=mk===thisMonth()?(+today().slice(8,10))/(+monthEnd(mk).slice(8,10)):1;
  const salaries=mtd*sum(S.staff.filter(st=>st.payType==='monthly'&&staffActiveIn(st,mk)),st=>num(st.rate));
  const labour=casual+salaries;
  const overheads=sum(S.expenses.filter(x=>monthKey(x.date)===mk),x=>num(x.amount));
  const gross=revenue-cogs-waste,net=gross-labour-overheads;
  const guests=sum(evs,e=>num(e.guests));
  return {mk,events:evs.length,guests,revenue,cogs,waste,casual,salaries,labour,overheads,gross,net,
    foodPct:revenue?(cogs+waste)/revenue:NaN,labourPct:revenue?labour/revenue:NaN,netPct:revenue?net/revenue:NaN,grossPct:revenue?gross/revenue:NaN}
}
function menuSales(days=90){const from=addDays(today(),-days);const out={};S.events.filter(e=>e.status==='completed'&&e.date>=from&&e.date<=today()).forEach(e=>(e.lines||[]).forEach(l=>{const o=out[l.menuId]=out[l.menuId]||{qty:0,rev:0};o.qty+=num(l.qty);o.rev+=num(l.qty)*num(l.price)}));return out}
function linReg(ys){const n=ys.length;if(n<2)return {a:ys[0]||0,b:0};const xs=ys.map((_,i)=>i);const mx=sum(xs)/n,my=sum(ys)/n;let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2});const b=de?nu/de:0;return {a:my-b*mx,b}}

function attention(){
  const a=[];const t=today();
  S.inventory.filter(i=>stockState(i)==='out').forEach(i=>a.push({sev:'bad',t:`${esc(i.name)} is out of stock`,d:`Reorder level ${num(i.reorder)} ${esc(i.unit)}`,go:'stock'}));
  S.inventory.filter(i=>stockState(i)==='low').forEach(i=>a.push({sev:'warn',t:`${esc(i.name)} is low`,d:`${num(i.qty)} ${esc(i.unit)} left, reorder at ${num(i.reorder)}`,go:'stock'}));
  S.inventory.filter(i=>expiryState(i)).forEach(i=>{const d=daysBetween(t,i.expiry);a.push({sev:d<0?'bad':'warn',t:`${esc(i.name)} ${d<0?'expired':'expires '+(d===0?'today':'in '+d+' days')}`,d:`${num(i.qty)} ${esc(i.unit)} worth ${money(itemValue(i))}`,go:'stock'})});
  S.events.filter(e=>e.status==='completed'&&evBalance(e)>0).sort((x,y)=>x.date.localeCompare(y.date)).forEach(e=>a.push({sev:daysBetween(e.date,t)>30?'bad':'warn',t:`${esc(e.client)} owes ${money(evBalance(e))}`,d:`Event on ${dShort(e.date)}, ${daysBetween(e.date,t)} days ago`,go:'sales'}));
  S.events.filter(e=>e.status==='confirmed'&&e.date>=t&&daysBetween(t,e.date)<=7&&!(C.shiftsByEvent[e.id]||[]).length).forEach(e=>a.push({sev:'warn',t:`No crew rostered for ${esc(e.client)}`,d:`${dLabel(e.date)}, ${num(e.guests)} covers`,go:'staff'}));
  S.events.filter(e=>e.status==='enquiry'&&e.date>=t&&daysBetween(t,e.date)<=14).forEach(e=>a.push({sev:'acc',t:`Follow up enquiry: ${esc(e.client)}`,d:`${dLabel(e.date)}, worth ${money(evRevenue(e))}`,go:'sales'}));
  S.tasks.filter(x=>x.status!=='done'&&x.due&&x.due<t).forEach(x=>a.push({sev:'bad',t:`Overdue task: ${esc(x.title)}`,d:`Due ${dShort(x.due)}${x.owner?' · '+esc(x.owner):''}`,go:'tasks'}));

async function runAI(){if(!sampleCap||UI.aiBusy)return;UI.aiBusy=true;UI.aiText='';render();

    months:P.map(p=>({month:p.mk,events:p.events,guests:p.guests,revenue:Math.round(p.revenue),foodAndWaste:Math.round(p.cogs+p.waste),labour:Math.round(p.labour),overheads:Math.round(p.overheads),net:Math.round(p.net)})),
    menu:matrix().map(m=>({dish:m.name,sold90d:m.qty,profitPerPortion:Math.round(m.gp),class:m.q})),eventTypes:Object.entries(S.events.filter(e=>e.status==='completed').reduce((o,e)=>{o[e.type]=(o[e.type]||0)+evRevenue(e);return o},{})).map(([k,v])=>({type:k,revenue:Math.round(v)})),
    pipeline:Math.round(sum(S.events.filter(e=>e.date>=today()&&e.status!=='cancelled'),evRevenue)),staffCount:S.staff.filter(s=>s.status!=='inactive').length,findings:ins};
  const prompt=`You are an experienced catering business consultant. Using only the figures below, write a growth plan for the next 90 days for this catering business.\n\nFormat: a one-paragraph diagnosis, then exactly five priorities. For each priority use a heading line starting with "### ", then 2-3 sentences: what to do, why the numbers support it, and the expected impact in ${S.settings.currency} where you can estimate it. Finish with "### Watch next month" and three metrics to track. Plain, direct language. No tables.\n\nDATA (JSON):\n${JSON.stringify(summary)}`;

  catch(e){UI.aiText=e&&e.text?e.text:'';toast(e&&e.code==='not_granted'?'The growth plan needs your permission to ask Claude.':e&&e.code==='rate_limited'?'Too many requests. Try again in a few minutes.':'Could not write the plan right now. Try again later.','bad')}
  UI.aiBusy=false;render()}

document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&MODAL!==null||ev.key==='Escape'&&$('#modalRoot').innerHTML)closeModal()});
$('#menuBtn').addEventListener('click',()=>$('#side').classList.toggle('open'));
function saveUI(){try{localStorage.setItem(LS_KEY+'-ui',JSON.stringify({page:UI.page,staffTab:UI.staffTab}))}catch(e){}}
function go(p){if(!PAGES[p])p='dashboard';UI.page=p;saveUI();$('#side').classList.remove('open');try{history.replaceState(null,'','#'+p)}catch(e){}render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p&&p!==UI.page&&PAGES[p]){UI.page=p;render()}});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>scheduleRender());
new MutationObserver(()=>scheduleRender()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(!PAGES[UI.page])UI.page='dashboard';
initStore();
})();
</script>
